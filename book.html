
<html>
<head>
<style>
body {
    background-color: white;
    font-family: Arial;
}

h2 {
    color: darkblue;
    text-decoration: underline;
}

table {
    background-color: lightcyan;
    padding: 25px;
    border: 3px solid navy;
    border-radius: 10px;
    width: 70%;
}

td {
    padding: 10px;
    font-size: 18px;
}

input, select {
    padding: 7px;
    width: 200px;
    font-size: 16px;
}
</style>
</head>

<body>

<h2>Car Booking Form</h2>

<form action="thankyou.html" target="main">

<table>

<tr>
<td><b>Full Name:</b></td>
<td><input type="text" required></td>
</tr>

<tr>
<td><b>Phone Number:</b></td>
<td><input type="text" required></td>
</tr>

<tr>
<td><b>Select Car Model:</b></td>
<td>
<select>
<option>Maruti Suzuki Swift</option>
<option>Hyundai i20</option>
<option>Tata Nexon</option>
<option>Mahindra Thar</option>
<option>Kia Seltos</option>
</select>
</td>
</tr>

<tr>
<td><b>Booking Date:</b></td>
<td><input type="date" required></td>
</tr>

<tr>
<td><b>City:</b></td>
<td><input type="text" required></td>
</tr>

<tr>
<td colspan="2" style="text-align:center;">
<input type="submit" value="Book Now" style="background-color: lightgreen; font-size: 18px;">
</td>
</tr>

</table>

</form>

</body>
</html>
